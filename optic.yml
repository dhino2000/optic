name: optic
# Python comes from Anaconda's `defaults` channel because its binaries are code-signed.
# On Windows 11 with Smart App Control enabled, unsigned builds (e.g. conda-forge Python)
# can fail with "DLL load failed ... blocked by application control policy".
channels:
  - defaults
dependencies:
  - python=3.10.22
  - pip
  - pip:
      - cellpose==3.1.0
      - colorama==0.4.6
      - contourpy==1.3.2
      - cycler==0.12.1
      - fastremap==1.17.7
      - filelock==3.20.3
      - fonttools==4.61.1
      - fsspec==2026.2.0
      - imagecodecs==2025.3.30
      - imageio==2.37.2
      # ITK wheels are unsigned; 5.4.6 is the build verified to run elastix under Smart App Control
      - itk==5.4.6
      - itk-core==5.4.6
      - itk-elastix==0.25.3
      - itk-filtering==5.4.6
      - itk-io==5.4.6
      - itk-numerics==5.4.6
      - itk-registration==5.4.6
      - itk-segmentation==5.4.6
      - jinja2==3.1.6
      - kiwisolver==1.4.9
      - lazy-loader==0.4
      - llvmlite==0.46.0
      - markupsafe==3.0.3
      - matplotlib==3.10.8
      - mpmath==1.3.0
      - natsort==8.4.0
      - networkx==3.4.2
      - numba==0.63.1
      - numpy==1.26.4
      - opencv-python-headless==4.11.0.86
      - pandas==2.3.3
      - pillow==12.1.0
      - pot==0.9.6
      - pygments==2.19.2
      - pyparsing==3.3.2
      - pyqt5==5.15.11
      - pyqt5-qt5==5.15.2
      - pyqt5-sip==12.18.0
      - pyqt6==6.10.2
      - pyqt6-qt6==6.10.2
      - pyqt6-sip==13.11.0
      - pyqtgraph==0.14.0
      - python-dateutil==2.9.0.post0
      - pytz==2026.2
      - qtpy==2.4.3
      - roifile==2025.12.12
      - scikit-image==0.25.2
      - scipy==1.15.3
